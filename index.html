<style>
/* Düzen: sabit üst çubuk + tek sütun; kütüphane ızgarası veya ~65 karakterlik okuma sayfası */
:root {
  --paper: #F3F5F0;   /* sayfa zemini: hafif yeşilimsi kâğıt */
  --surface: #FFFFFF; /* kartlar, açılır pencereler */
  --ink: #1E2928;     /* yazı */
  --muted: #5B6A66;   /* ikincil yazı */
  --rule: #D7DDD4;    /* çizgiler */
  --accent: #23508E;  /* lâcivert vurgu */
  --gilt: #A27A26;    /* yaldız: çok az kullanılır */
  --mark: #F2E3B3;    /* arama vurgusu */
  --font-display: "Marcellus", "Times New Roman", serif;
  --font-body: "Literata", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-arabic: "Amiri", "Traditional Arabic", serif;
  --reader-size: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111716; --surface: #1A2220; --ink: #E2E8E3; --muted: #93A39E;
    --rule: #2A3633; --accent: #93B3EA; --gilt: #D3AE5B; --mark: #4A3F1C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111716; --surface: #1A2220; --ink: #E2E8E3; --muted: #93A39E;
  --rule: #2A3633; --accent: #93B3EA; --gilt: #D3AE5B; --mark: #4A3F1C; color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Üst çubuk */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { font-family: var(--font-display); font-size: 24px; color: var(--ink); text-decoration: none; letter-spacing: .01em; display: flex; align-items: baseline; gap: 2px; }
.logo b { font-weight: 400; color: var(--gilt); }
.tools { margin-left: auto; display: flex; gap: 4px; }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font-size: 14px; color: var(--muted); }
.icon-btn:hover { border-color: var(--rule); color: var(--ink); }

main { max-width: 960px; margin: 0 auto; padding-block: 28px 64px; }

/* Kütüphane */
.hero { display: grid; gap: 6px; margin-bottom: 28px; }
.besmele { font-family: var(--font-arabic); font-size: 30px; color: var(--gilt); direction: rtl; text-align: left; line-height: 1.4; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; line-height: 1.55; }

.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 28px; }
.resume small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.resume strong { font-family: var(--font-body); font-weight: 600; font-size: 17px; }
.btn { background: var(--accent); color: var(--paper); border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 500; }

.section-label { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--muted); margin: 0 0 12px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.book { background: var(--surface); border: none; text-align: left; padding: 18px 18px 16px; cursor: pointer; display: grid; gap: 6px; align-content: start; min-width: 0; }
.book:hover { background: var(--paper); }
.book .no { font-size: 12px; color: var(--gilt); font-variant-numeric: tabular-nums; letter-spacing: .05em; }
.book h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.book p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.book .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { margin-top: 20px; font-size: 13px; color: var(--muted); max-width: 70ch; line-height: 1.5; }

/* Okuyucu */
.reader-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 22px; }
.crumb { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; }

.text { font-family: var(--font-body); font-size: var(--reader-size); line-height: 1.75; }

.w { cursor: pointer; border-bottom: 1px dotted color-mix(in srgb, var(--accent) 55%, transparent); }
.w:hover, .w.on { color: var(--accent); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

.pager { max-width: 65ch; margin: 36px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule); padding-top: 16px; }
.pager button { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.pager button:disabled { opacity: .4; cursor: default; }
.pageno { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.pageno input { width: 3.2em; text-align: center; font: inherit; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }

/* Lugat penceresi */
.lugat { position: fixed; z-index: 20; width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 14px 16px; }
.lugat .word { font-family: var(--font-body); font-weight: 600; font-size: 18px; }
.lugat .def { margin-top: 4px; line-height: 1.5; color: var(--ink); }
.lugat .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gilt); }

/* Arama */
.search-panel { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 8vh); }
.search-box { width: min(620px, 100%); background: var(--surface); border-radius: 12px; border: 1px solid var(--rule); max-height: 75vh; display: flex; flex-direction: column; overflow: hidden; }
.search-box input { border: none; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: inherit; font-size: 17px; background: transparent; color: var(--ink); outline: none; }
.results { overflow-y: auto; }
.result { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--rule); padding: 12px 18px; cursor: pointer; }
.result:hover { background: var(--paper); }
.result .where { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result .snip { font-family: var(--font-body); margin-top: 3px; line-height: 1.5; }
.empty { padding: 18px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .page { animation: fade .25s ease; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}

<script>
/* =========================================================
   1) VERİ
   Kitaplar ve sayfalar. Metinler DENEME metnidir: sitenin
   nasıl çalıştığını görmek için yazıldı, kitapların kendisinden
   alınmadı. Gerçek metni eklemek için "pages" dizisini doldur.
   ========================================================= */
const BOOKS = [
  {

    pages: [
      { section: "Birinci Bölüm", arabic: "بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ", text: [

        "İnsan, tefekkür ettikçe görür ki her şeyde bir intizam vardır. Bu intizam tesadüfle izah edilemez; bir Sâni'in kudret ve ilmine işaret eder."
      ]},
      { section: "Birinci Bölüm", text: [
        "Bir çiçeğe bakan kimse, onun nakışlarında bir sanat görür. Sanat ise sanatkârı gösterir. Gafletle bakan yalnız rengi görür; tefekkürle bakan ise mânâyı okur.",
        "İşte iman, insanın gözüne bir nur verir. O nur ile zulümat içinde görünen şeyler, birden aydınlanır ve her biri bir rahmet mektubu olur."
      ]},
      { section: "İkinci Bölüm", text: [
        "Dünya fânidir; ömür bir sermaye gibi elimize verilmiştir. Akıllı adam, fâni sermayesini bâki bir meyveye çevirmeye çalışır.",
        "Şükür, nimeti görmenin ve onu verene yönelmenin adıdır. Nimeti görüp vereni unutan, sofranın sahibini düşünmeden yiyen misafire benzer."
      ]},
      { section: "İkinci Bölüm", text: [
        "Ubudiyet, insanın aczini ve fakrını bilerek Rabbine yönelmesidir. Bu yönelişte bir zillet yoktur; bilakis en büyük izzet oradadır.",
        "Fıtrat, insana bırakılmış bir emanettir. Onu muhafaza eden, hem dünyada huzur bulur hem de bâki âleme hazırlanmış olur."
      ]}
    ]
  },
  {
    id: "mektubat", title: "Mektubat", desc: "Sorulara cevap olarak yazılmış mektuplar.",
    pages: [
      { section: "Birinci Mektup", text: [
        "Sual edilen meseleye kısa bir cevap verelim. Her hâdisenin bir hikmeti vardır; fakat o hikmet her zaman ilk bakışta görünmez.",
        "Şefkat ile bakan kalp, zahmet içinde bir rahmet bulur. Sabır ise o rahmetin anahtarı hükmündedir."
      ]},
      { section: "Birinci Mektup", text: [
        "Muhabbetin hakikisi, fâni şeylere değil bâki olana yönelir. Fâni olana bağlanan, ayrılık acısını da beraber alır.",
        "Kemal ve cemal sahibi olanı tanıyan, her güzellikte O'nun bir tecellisini görür ve sevgisi boşa gitmez."
      ]},
      { section: "İkinci Mektup", text: [
        "Kardeşlerime bir hatırlatma: ihlas, amelin ruhudur. İhlassız amel, ruhsuz bir ceset gibidir.",
        "Birbirimize karşı hürmet ve muhabbet, hizmetimizin en mühim esasıdır. Zira tesanüd içindeki az kuvvet, dağınık çok kuvvetten üstündür."
      ]}
    ]
  },
  {
    id: "lemalar", title: "Lem'alar", desc: "Kısa, parlak hakikat parıltıları.",
    pages: [
      { section: "Birinci Lem'a", text: [
        "Hastalık, insana aczini hatırlatan bir muallimdir. Gafletin perdesini yırtar ve kalbi Hâlık'ına çevirir.",
        "Sıhhat içinde unutulan şükür, hastalık içinde hatırlanır. Böylece zahmet, bir tefekkür ve tevbe vesilesi olur."
      ]},
      { section: "İkinci Lem'a", text: [
        "İhtiyarlık, kışa benzer; fakat arkasında bir bahar beklenir. İman ile bakan ihtiyar, bâki bir hayatın kapısında bulunduğunu bilir.",
        "Esmâ-i İlâhiyenin her biri, kâinatta bir tecelli ile görünür. Rahmet ismini anlamak isteyen, bir annenin şefkatine baksın."
      ]}
    ]
  },
  {
    id: "sualar", title: "Şualar", desc: "Tevhid ve iman üzerine uzun dersler.",
    pages: [
      { section: "Birinci Şuâ", text: [
        "Tevhid, kâinatın her köşesinde okunan bir hakikattir. Zerreden güneşe kadar her şey, aynı intizam ve aynı sanat ile işlenmiştir.",
        "Bu birlik, ilim ve kudret sahibi tek bir Sâni'i gösterir. Kesret içindeki vahdeti görmek, imanın en parlak nurudur."
      ]}
    ]
  }
];

/* Lugat: kelime → anlam. Anahtarlar küçük harf. */
const LUGAT = {
  "kâinat": "Bütün varlıklar, evren.",
  "zerre": "Çok küçük parça; atom.",
  "lisan": "Dil.",
  "mânâ": "Anlam.",
  "hikmet": "Bir şeyin gizli faydası ve sebebi; bilgelik.",
  "tefekkür": "Derin düşünme, ibretle bakma.",
  "intizam": "Düzen, tertip.",
  "izah": "Açıklama.",
  "sâni": "Sanatkâr; her şeyi sanatla yapan Allah.",
  "kudret": "Güç, kuvvet.",
  "ilim": "Bilgi.",
  "işaret": "Gösterme, belirti.",
  "nakış": "Süsleme, işleme.",
  "sanat": "Ustalıkla yapılmış iş.",
  "sanatkâr": "Sanat sahibi, usta.",
  "gaflet": "Dikkatsizlik, umursamazlık.",
  "iman": "İnanç; Allah'a ve O'ndan gelene kalben bağlanmak.",
  "nur": "Işık, aydınlık.",
  "zulümat": "Karanlıklar.",
  "rahmet": "Merhamet, şefkat ve ihsan.",
  "fâni": "Geçici, sonu olan.",
  "bâki": "Daimî, sonsuz kalıcı.",
  "sermaye": "Ana mal; burada: verilen imkân, ömür.",
  "şükür": "Nimeti verene minnet ve teşekkür.",
  "nimet": "İyilik, verilen güzel şey.",
  "ubudiyet": "Kulluk.",
  "acz": "Güçsüzlük.",
  "fakr": "Muhtaçlık.",
  "zillet": "Alçaklık, hor görülme.",
  "izzet": "Şeref, değer.",
  "fıtrat": "Yaratılış, tabiat.",
  "emanet": "Korunmak üzere bırakılan şey.",
  "muhafaza": "Koruma.",
  "âlem": "Dünya, evren; varlık alanı.",
  "sual": "Soru.",
  "hâdise": "Olay.",
  "şefkat": "Acıma ile karışık sevgi.",
  "zahmet": "Sıkıntı, eziyet.",
  "muhabbet": "Sevgi.",
  "hakiki": "Gerçek.",
  "kemal": "Olgunluk, mükemmellik.",
  "cemal": "Güzellik.",
  "tecelli": "Görünme, yansıma, belirme.",
  "ihlas": "Bir işi sadece Allah rızası için yapmak; samimiyet.",
  "amel": "İş, yapılan ibadet.",
  "hürmet": "Saygı.",
  "hizmet": "Görev, iş görme.",
  "mühim": "Önemli.",
  "esas": "Temel.",
  "tesanüd": "Dayanışma.",
  "muallim": "Öğretmen.",
  "hâlık": "Yaratan; Allah.",
  "sıhhat": "Sağlık.",
  "tevbe": "Pişmanlıkla Allah'a dönüş.",
  "vesile": "Sebep, araç.",
  "esmâ": "İsimler; Allah'ın isimleri.",
  "tevhid": "Allah'ın bir olduğuna inanmak.",
  "kesret": "Çokluk.",
  "vahdet": "Birlik.",
  "bilakis": "Tam tersine.",
  "temsil": "Benzetme, örnekle anlatma."
};

/* =========================================================
   2) YARDIMCILAR
   ========================================================= */
const $ = (s) => document.querySelector(s);
const lower = (s) => s.toLocaleLowerCase("tr");
// Arama için şapkaları kaldır: "mânâ" → "mana"
const plain = (s) => lower(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Tarayıcı hafızası (kapalıysa sessizce geç)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* Bir kelimenin lugat karşılığını bul.
   Önce tam eşleşme, sonra kök: "kâinatın" → "kâinat" (en az 4 harfli kök). */
const LUGAT_KEYS = Object.keys(LUGAT).sort((a, b) => b.length - a.length);
function findLugat(word) {
  const w = lower(word.replace(/['’].*$/, "")); // "Sâni'in" → "sâni"
  if (LUGAT[w]) return w;
  return LUGAT_KEYS.find((k) => k.length >= 4 && w.startsWith(k)) || null;
}

/* Paragraf metnini HTML'e çevir: lugatta olan kelimeleri tıklanabilir yap,
   arama kelimesini işaretle. */
function renderParagraph(text, highlight) {
  return text.replace(/[A-Za-zÇĞİÖŞÜçğıöşüÂÎÛâîû'’-]+/g, (word) => {
    let html = escapeHtml(word);
    if (highlight && plain(word).includes(highlight)) html = `<mark>${html}</mark>`;
    const key = findLugat(word);
    return key ? `<span class="w" data-k="${key}" tabindex="0">${html}</span>` : html;
  });
}

/* =========================================================
   3) GÖRÜNÜMLER
   ========================================================= */
const app = $("#app");

function showLibrary() {
  const last = store.get("nr-last", null);
  const lastBook = last && BOOKS.find((b) => b.id === last.book);
  app.innerHTML = `
    <section class="hero">
      <div class="besmele">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>
      <h1>Risale-i Nur Külliyatı</h1>
      <p>Okumak istediğin kitabı seç. Altı noktalı kelimelere dokununca anlamı açılır.</p>
    </section>
    ${lastBook ? `
      <div class="resume">
        <div><small>Kaldığın yer</small><strong>${lastBook.title}</strong> <span style="color:var(--muted)">· Sayfa ${last.page}</span></div>
        <button class="btn" id="resume">Devam et</button>
      </div>` : ""}
    <p class="section-label">Kitaplar</p>
    <div class="shelf">
      ${BOOKS.map((b, i) => `
        <button class="book" data-id="${b.id}">
          <span class="no">${String(i + 1).padStart(2, "0")}</span>
          <h3>${b.title}</h3>
          <p>${b.desc}</p>
          <span class="meta">${b.pages.length} sayfa</span>
        </button>`).join("")}
    </div>
    <p class="note">Bu ilk sürümdeki metinler deneme metnidir; sitenin çalışmasını göstermek için yazıldı. Gerçek metinler kodun en üstündeki BOOKS listesine eklenecek.</p>`;
  app.querySelectorAll(".book").forEach((el) => el.onclick = () => go(el.dataset.id, 1));
  if (lastBook) $("#resume").onclick = () => go(last.book, last.page);
  document.title = "NurRisale";
}

function showPage(bookId, pageNo, highlight) {
  const book = BOOKS.find((b) => b.id === bookId);
  if (!book) return showLibrary();
  pageNo = Math.min(Math.max(1, pageNo), book.pages.length);
  const page = book.pages[pageNo - 1];
  store.set("nr-last", { book: bookId, page: pageNo });

  // İçindekiler: her bölümün ilk sayfası
  const toc = [];
  book.pages.forEach((p, i) => { if (!toc.find((t) => t.section === p.section)) toc.push({ section: p.section, page: i + 1 }); });

  app.innerHTML = `
    <div class="reader-bar">
      <button class="crumb" id="back">← Kitaplar</button>
      <span class="demo-tag">Deneme metni</span>
      <select id="toc" aria-label="İçindekiler">
        ${toc.map((t) => `<option value="${t.page}" ${t.section === page.section ? "selected" : ""}>${t.section}</option>`).join("")}
      </select>
    </div>
    <article class="page">
      <div class="book-title">${book.title}</div>
      <h2>${page.section}</h2>
      <div class="ornament">✦ ✦ ✦</div>
      <div class="text">
        ${page.arabic ? `<p class="arabic">${page.arabic}</p>` : ""}
        ${page.text.map((t) => `<p>${renderParagraph(t, highlight)}</p>`).join("")}
      </div>
    </article>
    <nav class="pager">
      <button id="prev" ${pageNo === 1 ? "disabled" : ""}>← Önceki</button>
      <span class="pageno">Sayfa <input id="pageinput" type="number" min="1" max="${book.pages.length}" value="${pageNo}" aria-label="Sayfa numarası"> / ${book.pages.length}</span>
      <button id="next" ${pageNo === book.pages.length ? "disabled" : ""}>Sonraki →</button>
    </nav>`;

  $("#back").onclick = () => { location.hash = ""; };
  $("#prev").onclick = () => go(bookId, pageNo - 1);
  $("#next").onclick = () => go(bookId, pageNo + 1);
  $("#toc").onchange = (e) => go(bookId, +e.target.value);
  $("#pageinput").onchange = (e) => go(bookId, +e.target.value || 1);
  document.title = `${book.title} · NurRisale`;
  window.scrollTo(0, 0);
}

/* =========================================================
   4) YÖNLENDİRME (adres çubuğundaki #sozler-3 gibi)
   ========================================================= */
let pendingHighlight = null;
function go(bookId, page) { location.hash = `${bookId}-${page}`; }
function route() {
  hideLugat();
  const m = location.hash.match(/^#([a-z]+)-(\d+)$/);
  if (m) showPage(m[1], +m[2], pendingHighlight); else showLibrary();
  pendingHighlight = null;
}
window.addEventListener("hashchange", route);

/* =========================================================
   5) LUGAT PENCERESİ
   ========================================================= */
const lugat = $("#lugat");
function hideLugat() { lugat.hidden = true; document.querySelectorAll(".w.on").forEach((e) => e.classList.remove("on")); }
function showLugat(el) {
  hideLugat();
  el.classList.add("on");
  const key = el.dataset.k;
  lugat.innerHTML = `<div class="lbl">Lugat</div><div class="word">${key}</div><div class="def">${LUGAT[key]}</div>`;
  lugat.hidden = false;
  // Kelimenin altına yerleştir, ekrandan taşmasın
  const r = el.getBoundingClientRect(), w = lugat.offsetWidth, h = lugat.offsetHeight;
  let left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), window.innerWidth - w - 16);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 16) top = r.top - h - 8;
  lugat.style.left = left + "px";
  lugat.style.top = top + "px";
}
document.addEventListener("click", (e) => {
  const w = e.target.closest(".w");
  if (w) return showLugat(w);
  if (!e.target.closest("#lugat")) hideLugat();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.classList?.contains("w")) showLugat(e.target);
  if (e.key === "Escape") { hideLugat(); closeSearch(); }
});
window.addEventListener("scroll", hideLugat, { passive: true });

/* =========================================================
   6) ARAMA
   ========================================================= */
const searchPanel = $("#search"), q = $("#q"), results = $("#results");
function openSearch() { searchPanel.hidden = false; q.focus(); runSearch(); }
function closeSearch() { searchPanel.hidden = true; }
function runSearch() {
  const term = plain(q.value.trim());
  if (term.length < 2) { results.innerHTML = `<div class="empty">En az 2 harf yaz.</div>`; return; }
  const hits = [];
  BOOKS.forEach((b) => b.pages.forEach((p, i) => p.text.forEach((t) => {
    const idx = plain(t).indexOf(term);
    if (idx >= 0) hits.push({ b, page: i + 1, section: p.section, t, idx });
  })));
  if (!hits.length) { results.innerHTML = `<div class="empty">“${escapeHtml(q.value)}” için sonuç yok.</div>`; return; }
  results.innerHTML = hits.slice(0, 50).map((h, n) => {
    const start = Math.max(0, h.idx - 50);
    const snip = (start ? "…" : "") + h.t.slice(start, h.idx + term.length + 70) + "…";
    return `<button class="result" data-n="${n}">
      <div class="where">${h.b.title} · ${h.section} · Sayfa ${h.page}</div>
      <div class="snip">${renderParagraph(snip, term).replace(/<span[^>]*>|<\/span>/g, "")}</div>
    </button>`;
  }).join("");
  results.querySelectorAll(".result").forEach((el) => el.onclick = () => {
    const h = hits[+el.dataset.n];
    pendingHighlight = term;
    closeSearch();
    const target = `#${h.b.id}-${h.page}`;
    if (location.hash === target) route(); else location.hash = target;
  });
}
q.addEventListener("input", runSearch);
searchPanel.addEventListener("click", (e) => { if (e.target === searchPanel) closeSearch(); });
$("#btn-search").onclick = openSearch;

/* =========================================================
   7) AYARLAR: yazı boyutu ve gece modu
   ========================================================= */
let size = store.get("nr-size", 19);
function applySize() { document.documentElement.style.setProperty("--reader-size", size + "px"); store.set("nr-size", size); }
$("#btn-smaller").onclick = () => { size = Math.max(15, size - 1); applySize(); };
$("#btn-bigger").onclick = () => { size = Math.min(28, size + 1); applySize(); };

let theme = store.get("nr-theme", null);
function applyTheme() { if (theme) document.documentElement.dataset.theme = theme; }
$("#btn-theme").onclick = () => {
  const isDark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = isDark ? "light" : "dark";
  applyTheme(); store.set("nr-theme", theme);
};
$("#home").onclick = (e) => { e.preventDefault(); location.hash = ""; };

applySize(); applyTheme(); route();
</script>
