<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NurRisale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=Amiri&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Düzen: üst çubuk; bilgisayarda okurken solda sabit içindekiler, telefonda açılır pencere; ana sayfa kapak ızgarası */
:root {
  --paper: #FFFFFF;   /* zemin */
  --surface: #FFFFFF; /* paneller */
  --soft: #F1F5F9;    /* hafif dolgu */
  --ink: #0F172A;     /* yazı */
  --muted: #64748B;   /* ikincil yazı */
  --rule: #E2E8F0;    /* çizgiler */
  --accent: #0284C7;  /* mavi vurgu */
  --gilt: #9F1239;    /* Arapça ve süs: koyu kırmızı */
  --mark: #FEF08A;    /* arama vurgusu */
  --wall: #F8FAFC;
  --shelf: transparent; --shelf-edge: transparent;
  --font-display: "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "Literata", "Amiri", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-arabic: "Amiri", "Traditional Arabic", serif;
  --reader-size: 19px;
  --reader-lh: 1.75;
  --reader-font: var(--font-body);
  --side-w: 330px;
}
/* Sepya tonu (açık temanın sıcak hâli) */
:root[data-tone="sepia"] { --paper: #F6EFDF; --surface: #FBF6EA; --soft: #EFE5CF; --ink: #3A2E21; --muted: #786853; --rule: #E3D6BB; --accent: #A0522D; --gilt: #8B1E2D; --mark: #F0D98F; --wall: #F2E9D6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1120; --surface: #111827; --soft: #1E293B; --ink: #E5E7EB; --muted: #94A3B8; --rule: #1F2937;
    --accent: #38BDF8; --gilt: #FDA4AF; --mark: #713F12; --wall: #0F172A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B1120; --surface: #111827; --soft: #1E293B; --ink: #E5E7EB; --muted: #94A3B8; --rule: #1F2937;
  --accent: #38BDF8; --gilt: #FDA4AF; --mark: #713F12; --wall: #0F172A; color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Üst çubuk */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.logo { font-family: var(--font-ui); font-weight: 700; letter-spacing: -.02em; font-size: 22px; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; }
.logo b { font-weight: 700; color: var(--accent); }
.tools { margin-left: auto; display: flex; gap: 2px; }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 8px; height: 38px; min-width: 38px; padding: 0 10px; cursor: pointer; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn:hover { border-color: var(--rule); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
#btn-menu { margin-left: -8px; color: var(--ink); }

main { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px; }

/* ---------- Kütüphane (kitap rafı) ---------- */
.hero { text-align: center; display: grid; gap: 6px; margin-bottom: 8px; }
.besmele { font-family: var(--font-arabic); font-size: 26px; color: var(--gilt); line-height: 1.4; }
.hero h1 { font-family: var(--font-ui); font-weight: 700; letter-spacing: -.02em; font-size: clamp(26px, 4.5vw, 36px); margin: 0; text-wrap: balance; }
.hero p { margin: 0 auto; color: var(--muted); max-width: 52ch; line-height: 1.55; }

.shelf-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 12px; }
.shelf-title h2 { font-family: var(--font-ui); font-weight: 650; font-size: 20px; margin: 0; letter-spacing: -.01em; }
.shelf-title span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bookcase { padding: 4px 0 0; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--slot), 1fr)); gap: 26px 18px; --slot: 128px; --cover-h: 190px; }
.slot { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.stand { width: 100%; height: var(--cover-h); display: flex; justify-content: center; align-items: flex-end; }
.cover { height: var(--cover-h); width: auto; max-width: calc(100% - 14px); border: none; padding: 0; cursor: pointer; position: relative; border-radius: 4px; overflow: hidden;
  background: var(--soft); box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 8px 20px -8px rgba(15,23,42,.35); transition: transform .2s ease; display: block; }
.cover img { height: 100%; width: auto; max-width: 100%; object-fit: cover; display: block; }
.cover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.18) 0, rgba(255,255,255,.1) 3%, rgba(0,0,0,0) 6%); }
.cover:hover, .cover:focus-visible { transform: translateY(-4px); }
.slot .cap { text-align: center; padding: 10px 4px 0; font-size: 13.5px; font-weight: 500; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slot .pg { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.slot .read { font-size: 11px; color: var(--gilt); }
@media (max-width: 560px) { .row { --slot: 96px; --cover-h: 146px; gap: 20px 12px; } }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-top: 22px; }
.resume small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.resume strong { font-family: var(--font-body); font-weight: 600; font-size: 17px; }
.btn { background: var(--accent); color: var(--paper); border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 500; }

/* ---------- Çekmece (soldan açılan pencere) ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 40%, transparent); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.drawer { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); background: var(--surface); border-right: 1px solid var(--rule);
  transform: translateX(-102%); transition: transform .25s ease; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
body.drawer-open .drawer { transform: none; }
body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--rule); }
.drawer-head .logo { font-size: 20px; }
.drawer-head .icon-btn { margin-left: auto; }
.drawer-body { overflow-y: auto; flex: 1; padding: 6px 0 24px; }
.d-label { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--muted); padding: 16px 18px 8px; }
.d-group summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 18px; font-weight: 600; font-size: 14px; }
.d-group summary::-webkit-details-marker { display: none; }
.d-group summary .caret { color: var(--muted); font-size: 11px; transition: transform .15s ease; }
.d-group[open] summary .caret { transform: rotate(90deg); }
.d-group summary .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.d-book { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; padding: 8px 18px; cursor: pointer; text-align: left; }
.d-book:hover { background: var(--paper); }
.d-book.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.d-book .chip { width: 26px; height: 40px; object-fit: cover; border-radius: 1px 3px 3px 1px; flex: none; box-shadow: 2px 2px 4px -1px rgba(0,0,0,.35); background: #7A1426; }
.d-book .n { font-weight: 500; font-size: 15px; }
.d-book .m { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc details { border-top: 1px solid var(--rule); }
.toc details:last-child { border-bottom: 1px solid var(--rule); }
.toc summary { list-style: none; display: flex; align-items: center; gap: 4px; cursor: pointer; padding-right: 10px; }
.toc summary::-webkit-details-marker { display: none; }
.toc summary .caret { width: 28px; flex: none; text-align: center; color: var(--muted); font-size: 11px; transition: transform .15s ease; }
.toc details[open] summary .caret { transform: rotate(90deg); }
.toc summary .caret.none { visibility: hidden; }
.toc a { display: flex; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink); padding: 8px 0; flex: 1; min-width: 0; line-height: 1.35; }
.toc a .pg { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
.toc summary a { font-weight: 600; font-size: 14.5px; }
.toc .sub a { font-size: 14px; padding: 6px 12px 6px 46px; }
.toc .sub a.l3 { padding-left: 62px; color: var(--muted); }
.toc a:hover { color: var(--accent); }
.toc a.cur { color: var(--accent); }
.toc .loose a { padding-left: 18px; padding-right: 12px; }

/* ---------- Okuyucu ---------- */
.reader-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 22px; }
.crumb { background: none; border: 1px solid var(--rule); border-radius: 99px; color: var(--ink); cursor: pointer; padding: 6px 12px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.crumb:hover { border-color: var(--accent); color: var(--accent); }
.page { max-width: 65ch; margin: 0 auto; }
.page .book-title { font-size: 12px; color: var(--accent); text-align: center; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.page h2 { font-family: var(--font-ui); font-weight: 650; letter-spacing: -.01em; font-size: 26px; text-align: center; margin: 6px 0 4px; text-wrap: balance; }
.ornament { text-align: center; color: var(--gilt); letter-spacing: .6em; margin-bottom: 24px; font-size: 13px; }
.text { font-family: var(--reader-font); font-size: var(--reader-size); line-height: var(--reader-lh); overflow-wrap: break-word; }
.text p { margin: 0 0 1.1em; text-indent: 1.5em; hyphens: auto; }
.text p.c { text-align: center; text-indent: 0; }
.text .arabic { font-family: var(--font-arabic); direction: rtl; text-align: center; font-size: 1.35em; text-indent: 0; color: var(--gilt); line-height: 1.9; }
.text h4 { font-family: var(--font-ui); font-weight: 600; font-size: 1.05em; text-align: center; margin: 1.6em 0 .8em; color: var(--accent); text-wrap: balance; }
.w { cursor: pointer; border-bottom: 1px dotted color-mix(in srgb, var(--accent) 55%, transparent); }
.w:hover, .w.on { color: var(--accent); }
.aw { cursor: help; border-bottom: 1px dotted color-mix(in srgb, var(--gilt) 60%, transparent); border-radius: 3px; }
.aw:hover, .aw.on { background: color-mix(in srgb, var(--gilt) 14%, transparent); }
.fn { font: 600 .66em/1 var(--font-ui); position: relative; top: -.6em; background: color-mix(in srgb, var(--accent) 12%, transparent); border: none; border-radius: 4px; color: var(--accent); cursor: pointer; padding: 1px 4px; margin: 0 1px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; font-family: var(--font-body); }

.pager { max-width: 65ch; margin: 36px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule); padding-top: 16px; }
.pager button { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.pager button:disabled { opacity: .4; cursor: default; }
.pageno { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.pageno input { width: 3.6em; text-align: center; font: inherit; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }

/* Lugat / haşiye penceresi */
.pop { position: fixed; z-index: 20; width: min(340px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 14px 16px; }
.pop .word { font-family: var(--font-body); font-weight: 600; font-size: 18px; }
.pop .def { margin-top: 4px; line-height: 1.55; color: var(--ink); font-family: var(--font-body); }
.pop .ref { margin-top: 8px; font-size: 12px; color: var(--muted); }
.pop .ar { font-family: var(--font-arabic); direction: rtl; font-size: 20px; line-height: 1.7; color: var(--gilt); margin-top: 2px; }
.pop .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gilt); }

/* Arama */
.search-panel { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, #000 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 8vh); }
.search-box { width: min(620px, 100%); background: var(--surface); border-radius: 12px; border: 1px solid var(--rule); max-height: 75vh; display: flex; flex-direction: column; overflow: hidden; }
.search-box input { border: none; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: inherit; font-size: 17px; background: transparent; color: var(--ink); outline: none; }
.results { overflow-y: auto; }
.result { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--rule); padding: 12px 18px; cursor: pointer; }
.result:hover { background: var(--paper); }
.result .where { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result .snip { font-family: var(--font-body); margin-top: 3px; line-height: 1.5; }
.empty { padding: 18px; color: var(--muted); }

/* İlerleme çubuğu */
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--gilt); width: 0; transition: width .25s ease; }
/* Okuyucu düğmeleri */
.reader-bar .spacer { flex: 1; }
.crumb.on { background: color-mix(in srgb, var(--gilt) 16%, transparent); border-color: var(--gilt); color: var(--ink); }
.crumb svg { width: 16px; height: 16px; }
.text .speaking { background: color-mix(in srgb, var(--gilt) 14%, transparent); border-radius: 4px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--gilt) 14%, transparent); }
/* Ayarlar paneli */
.settings { position: fixed; z-index: 35; top: calc(env(safe-area-inset-top, 0px) + 58px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.2); padding: 16px; display: grid; gap: 16px; }
.settings .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 6px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.seg button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seg .sw-light { background: #F3F5F0; color: #1E2928; } .seg .sw-sepia { background: #F4ECDA; color: #3A2E21; } .seg .sw-dark { background: #111716; color: #E2E8E3; }
.seg .f-book { font-family: "Literata", Georgia, serif; } .seg .f-classic { font-family: "EB Garamond", Georgia, serif; font-size: 15px; } .seg .f-sans { font-family: var(--font-ui); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 40px; height: 36px; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; cursor: pointer; font-size: 16px; }
.stepper output { flex: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
/* Yer imleri */
.marks { display: grid; }
.mark-row { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; }
.mark-row a { flex: 1; min-width: 0; text-decoration: none; color: var(--ink); padding: 8px 0; line-height: 1.35; }
.mark-row a small { display: block; color: var(--muted); font-size: 12px; }
.mark-row button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; font-size: 13px; }
.mark-row button:hover { color: var(--ink); }
.marks-home { margin-top: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 0; }
.marks-home .head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 18px; }
/* Seçim araç çubuğu */
.seltool { position: fixed; z-index: 25; display: flex; gap: 2px; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.seltool button { background: none; border: none; color: inherit; padding: 6px 10px; cursor: pointer; font-size: 13px; border-radius: 6px; }
.seltool button:hover { background: color-mix(in srgb, var(--paper) 15%, transparent); }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 99px; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.scope { display: flex; gap: 6px; padding: 10px 18px 0; }
.scope button { border: 1px solid var(--rule); background: none; border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.scope button.on { border-color: var(--accent); color: var(--accent); }
@media (max-width: 520px) { .crumb .t { display: none; } }

@media (min-width: 1100px) {
  body.reading:not(.side-off) .drawer { transform: none; top: calc(env(safe-area-inset-top, 0px) + 55px); width: var(--side-w); z-index: 4; transition: none; }
  body.reading:not(.side-off) .drawer-head { display: none; }
  body.reading:not(.side-off) .scrim { display: none; }
  body.reading:not(.side-off) main { margin-left: calc(var(--side-w) + max(24px, (100vw - var(--side-w) - 900px) / 2)); margin-right: auto; max-width: 900px; }
  body.reading .top-inner { max-width: none; }
  body.reading:not(.side-off) #toc-btn { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .drawer, .scrim, .cover { transition: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .page { animation: fade .25s ease; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}
</style>

<header class="top">
  <div class="top-inner gutter">
    <button class="icon-btn" id="btn-menu" aria-label="Kütüphane ve içindekiler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <a class="logo" href="#" id="home">Nur<b>Risale</b></a>
    <div class="tools">
      <button class="icon-btn" id="btn-search" aria-label="Ara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Okuma ayarları" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 9 5l5 13M5.8 13.5h6.4"/><path d="M15 18c0-2 1.3-3.2 3-3.2s2.8 1 2.8 3.2V18m0-1.5c0 1-1 1.7-2.4 1.7-1.2 0-2-.6-2-1.5"/></svg>
      </button>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Kütüphane">
  <div class="drawer-head">
    <a class="logo" href="#" id="drawer-home">Nur<b>Risale</b></a>
    <button class="icon-btn" id="btn-close" aria-label="Kapat">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</nav>

<main class="gutter" id="app"></main>

<div class="pop" id="pop" hidden role="dialog" aria-live="polite"></div>
<div class="settings" id="settings" hidden role="dialog" aria-label="Okuma ayarları">

// Her ifade için harekeyi ve harf çeşitlerini (أ إ آ, ى ي, ة ه) yok sayan bir kalıp kur
const AR_MARKS = "[\\u064B-\\u065F\\u0670\\u0640\\u06D6-\\u06ED]*";
const AR_VARIANTS = { "ا": "[اأإآٱ]", "ى": "[ىيئ]", "ي": "[يىئ]", "ة": "[ةته]", "ه": "[هة]", "و": "[وؤ]", "ت": "[تة]", "ك": "[كک]", "ء": "[ءئؤأ]?" };
const arPattern = (key) => [...key].map((ch) => ch === " " ? "\\s*" : (AR_VARIANTS[ch] || ch) + AR_MARKS).join("");
const AR_ORDER = ARAPCA.map((x, i) => i).sort((a, b) => ARAPCA[b].a.length - ARAPCA[a].a.length);
const AR_RE = new RegExp(AR_ORDER.map((i) => `(${arPattern(ARAPCA[i].a)})`).join("|"), "g");
function renderArabic(text) {
  let out = "", last = 0;
  for (const m of text.matchAll(AR_RE)) {
    const g = m.slice(1).findIndex((x) => x !== undefined);
    out += escapeHtml(text.slice(last, m.index));
    out += `<span class="aw" data-a="${AR_ORDER[g]}" tabindex="0">${escapeHtml(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(text.slice(last));
}

/* =========================================================
   2) YARDIMCILAR
   ========================================================= */
const $ = (s) => document.querySelector(s);
const lower = (s) => s.toLocaleLowerCase("tr");
const plain = (s) => lower(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i");
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const FN_RE = /⟦([^|⟧]+)\|([^⟧]*)⟧/g;   // haşiye işareti: ⟦kimlik|numara⟧
const stripFn = (s) => s.replace(FN_RE, "");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

async function loadLibrary() {
  const r = await fetch("books/index.json");
  if (!r.ok) throw new Error("Kitap listesi yüklenemedi");
  LIBRARY = await r.json();
}
async function loadBook(id) {
  if (BOOKS.has(id)) return BOOKS.get(id);
  const r = await fetch(`books/${id}.json`);
  if (!r.ok) throw new Error("Kitap yüklenemedi");
  const book = await r.json();
  BOOKS.set(id, book);
  return book;
}
const metaOf = (id) => LIBRARY.find((b) => b.id === id);
const SHELVES = [{ id: "kulliyat", title: "Külliyat" }, { id: "cep", title: "Cep Risaleleri" }];

/* Lugat: önce tam eşleşme, sonra kök ("kâinatın" → "kâinat", en az 4 harf) */
let LUGAT_KEYS = [];
function indexLugat() { LUGAT_KEYS = Object.keys(LUGAT).sort((a, b) => b.length - a.length); }
indexLugat();
// Büyük lugat ayrı dosyada: books/lugat.json
async function loadLugat() {
  try {
    const r = await fetch("books/lugat.json");
    if (r.ok) { const extra = await r.json(); for (const k in extra) LUGAT[lower(k)] = extra[k]; indexLugat(); }
  } catch {}
}
function findLugat(word) {
  const w = lower(word.replace(/['’].*$/, ""));
  if (LUGAT[w]) return w;
  return LUGAT_KEYS.find((k) => k.length >= 4 && w.startsWith(k)) || null;
}

const WORD = /([A-Za-zÇĞİÖŞÜçğıöşüÂÎÛâîû'’-]+)/;
function renderWords(text, highlight) {
  return text.split(WORD).map((part, i) => {
    if (i % 2 === 0) return escapeHtml(part);
    let html = escapeHtml(part);
    if (highlight && plain(part).includes(highlight)) html = `<mark>${html}</mark>`;
    const key = findLugat(part);
    return key ? `<span class="w" data-k="${key}" tabindex="0">${html}</span>` : html;
  }).join("");
}
function renderText(text, highlight) {
  let out = "", last = 0;
  for (const m of text.matchAll(FN_RE)) {
    out += renderWords(text.slice(last, m.index), highlight);
    out += `<button class="fn" data-fn="${escapeHtml(m[1])}" aria-label="Haşiye ${escapeHtml(m[2])}">${escapeHtml(m[2] || "*")}</button>`;
    last = m.index + m[0].length;
  }
  return out + renderWords(text.slice(last), highlight);
}
function renderBlock([k, t], highlight) {
  if (k === "ar") return `<p class="arabic" lang="ar">${renderArabic(stripFn(t))}</p>`;
  if (k === "h") return `<h4>${renderText(t, highlight)}</h4>`;
  return `<p${k === "c" ? ' class="c"' : ""} dir="auto">${renderText(t, highlight)}</p>`;
}

/* =========================================================
   3) ÇEKMECE: kütüphane + içindekiler
   ========================================================= */
let current = { id: null, page: 0 };
function renderDrawer() {
  const book = current.id && BOOKS.get(current.id);
  const curShelf = current.id ? (metaOf(current.id)?.shelf || "kulliyat") : "kulliyat";
  let html = `<div class="d-label">Kütüphane</div>` + SHELVES.map((sh) => {
    const list = LIBRARY.filter((b) => (b.shelf || "kulliyat") === sh.id);
    if (!list.length) return "";
    return `<details class="d-group" ${sh.id === curShelf && !sidebarOn() ? "open" : ""}>
      <summary><span class="caret">▶</span>${sh.title}<span class="n">${list.length}</span></summary>
      ${list.map((b) => `
        <button class="d-book ${b.id === current.id ? "cur" : ""}" data-open="${b.id}">
          <img class="chip" src="${b.cover}" alt="" width="26" height="40" loading="lazy">
          <span><div class="n">${escapeHtml(b.title)}</div><div class="m">${b.pages.toLocaleString("tr")} sayfa</div></span>
        </button>`).join("")}
    </details>`;
  }).join("");

  if (getMarks().length) html += `<div class="d-label">Yer imlerim</div>${marksHtml()}`;
  if (book) {
    // İçindekiler: her ana bölüm (seviye 1) açılıp kapanan bir grup
    const groups = [];
    let g = { head: null, items: [] };
    for (const t of book.toc) {
      if (t.l === 1) { groups.push(g); g = { head: t, items: [] }; } else g.items.push(t);
    }
    groups.push(g);
    const link = (t, cls = "") => `<a href="#${book.id}-${t.p}" class="${cls} ${t.p === current.page ? "cur" : ""}"><span>${escapeHtml(t.t)}</span><span class="pg">${t.p}</span></a>`;
    const nextStart = (i) => { for (let j = i + 1; j < groups.length; j++) if (groups[j].head) return groups[j].head.p; return Infinity; };
    html += `<div class="d-label">İçindekiler · ${escapeHtml(book.title)}</div><div class="toc">` + groups.map((gr, i) => {
      if (!gr.head) return gr.items.length ? `<div class="loose">${gr.items.map((t) => link(t)).join("")}</div>` : "";
      const open = current.page >= gr.head.p && current.page < nextStart(i);
      return `<details ${open ? "open" : ""}>
        <summary><span class="caret ${gr.items.length ? "" : "none"}">▶</span>${link(gr.head)}</summary>
        ${gr.items.length ? `<div class="sub">${gr.items.map((t) => link(t, "l" + t.l)).join("")}</div>` : ""}
      </details>`;
    }).join("") + `</div>`;
  }
  $("#drawer-body").innerHTML = html;
  $("#drawer-body").querySelectorAll("[data-open]").forEach((el) => el.onclick = () => { closeDrawer(); go(el.dataset.open, 1); });
  $("#drawer-body").querySelectorAll(".toc a, .mark-row a").forEach((a) => a.addEventListener("click", closeDrawer));
  bindMarks($("#drawer-body"), renderDrawer);
}
const wide = () => matchMedia("(min-width: 1100px)").matches;
const sidebarOn = () => wide() && document.body.classList.contains("reading") && !document.body.classList.contains("side-off");
function refreshSidebar() {
  if (!sidebarOn()) return;
  renderDrawer();
  const cur = $("#drawer-body .toc a.cur") || $("#drawer-body .toc details[open]");
  if (cur) cur.scrollIntoView({ block: "center" });
}
function openDrawer() {
  // Bilgisayarda okurken sol panel zaten açık: düğme onu gizleyip gösterir
  if (wide() && document.body.classList.contains("reading")) {
    document.body.classList.toggle("side-off");
    store.set("nr-side-off", document.body.classList.contains("side-off"));
    if (!document.body.classList.contains("side-off")) { refreshSidebar(); return; }
  }
  renderDrawer();
  document.body.classList.add("drawer-open");
  const cur = $("#drawer-body .toc a.cur") || $("#drawer-body .toc details[open]");
  if (cur) cur.scrollIntoView({ block: "center" });
  $("#btn-close").focus();
}
function closeDrawer() { document.body.classList.remove("drawer-open"); }
$("#btn-menu").onclick = openDrawer;
$("#btn-close").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;

  app.innerHTML = `
    <section class="hero">
      <div class="besmele">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>
      <h1>Risale-i Nur Külliyatı</h1>
      <p>Külliyatın tamamı ve cep risaleleri burada. Okumak istediğin kitabı raftan seç. Altı noktalı kelimelerin ve Arapça ifadelerin üstüne gelince anlamı, küçük numaralarda haşiye açılır.</p>
    </section>
    ${SHELVES.map((sh) => {
      const list = LIBRARY.filter((b) => (b.shelf || "kulliyat") === sh.id);
      if (!list.length) return "";
      return `<section>
        <div class="shelf-title"><h2>${sh.title}</h2><span>${list.length} kitap</span></div>
        <div class="bookcase"><div class="row">
          ${list.map((b) => `<div class="slot">
            <div class="stand"><button class="cover" data-open="${b.id}" aria-label="${escapeHtml(b.title)}">
              <img src="${b.cover}" alt="${escapeHtml(b.title)} kapağı" loading="lazy" height="196">
            </button></div>
            <div class="cap">${escapeHtml(b.title)}</div>
            <div class="pg">${b.pages.toLocaleString("tr")} sayfa</div>
          </div>`).join("")}
        </div></div>
      </section>`;
    }).join("")}
    ${lastMeta ? `
      <div class="resume">
        <div><small>Kaldığın yer</small><strong>${escapeHtml(lastMeta.title)}</strong> <span style="color:var(--muted)">· Sayfa ${last.page}</span></div>
        <button class="btn" id="resume">Devam et</button>
      </div>` : ""}
    ${getMarks().length ? `<div class="marks-home"><div class="head">Yer imlerim</div>${marksHtml()}</div>` : ""}`;
  bindMarks(app);
  app.querySelectorAll("[data-open]").forEach((el) => el.onclick = () => go(el.dataset.open, 1));
  if (lastMeta) $("#resume").onclick = () => go(last.book, last.page);
  document.title = "NurRisale";
}

async function showPage(bookId, pageNo, highlight) {
  const meta = metaOf(bookId);
  if (!meta) return showLibrary();
  if (!BOOKS.has(bookId)) {
    app.innerHTML = `<div class="loading">${escapeHtml(meta.title)} açılıyor…</div>`;
    try { await loadBook(bookId); } catch { app.innerHTML = `<div class="loading">Kitap açılamadı. İnternet bağlantını kontrol edip sayfayı yenile.</div>`; return; }
  }
  const book = BOOKS.get(bookId);
  pageNo = Math.min(Math.max(1, pageNo), book.pages.length);
  const page = book.pages[pageNo - 1];
  current = { id: bookId, page: pageNo };
  store.set("nr-last", { book: bookId, page: pageNo });

  app.innerHTML = `
    <div class="reader-bar">
      <button class="crumb" id="toc-btn">☰ <span class="t">İçindekiler</span></button>
      <span class="spacer"></span>
      <button class="crumb ${isMarked(bookId, pageNo) ? "on" : ""}" id="mark-btn" aria-pressed="${isMarked(bookId, pageNo)}">
        <svg viewBox="0 0 24 24" fill="${isMarked(bookId, pageNo) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg><span class="t">${isMarked(bookId, pageNo) ? "İşaretli" : "İşaretle"}</span>
      </button>
      ${speechOK ? `<button class="crumb ${speaking ? "on" : ""}" id="listen-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span class="t">${speaking ? "Durdur" : "Dinle"}</span>
      </button>` : ""}
    </div>
    <article class="page">
      <div class="book-title">${escapeHtml(book.title)}</div>
      <h2>${escapeHtml(page.s)}</h2>
      <div class="ornament">✦ ✦ ✦</div>
      <div class="text">${page.b.map((b) => renderBlock(b, highlight)).join("")}</div>
    </article>
    <nav class="pager">
      <button id="prev" ${pageNo === 1 ? "disabled" : ""}>← Önceki</button>
      <span class="pageno">Sayfa <input id="pageinput" type="number" min="1" max="${book.pages.length}" value="${pageNo}" aria-label="Sayfa numarası"> / ${book.pages.length}</span>
      <button id="next" ${pageNo === book.pages.length ? "disabled" : ""}>Sonraki →</button>
    </nav>`;

  $("#toc-btn").onclick = openDrawer;
  $("#mark-btn").onclick = () => { toggleMark(book, pageNo, page.s); showPage(bookId, pageNo); };
  if (speechOK) $("#listen-btn").onclick = () => speaking ? stopSpeaking() : startSpeaking();
  $("#progress").style.width = (pageNo / book.pages.length * 100) + "%";
  if (speaking) setTimeout(speakPage, 300);
  refreshSidebar();
  $("#prev").onclick = () => go(bookId, pageNo - 1);
  $("#next").onclick = () => go(bookId, pageNo + 1);
  $("#pageinput").onchange = (e) => go(bookId, +e.target.value || 1);
  document.title = `${book.title} · NurRisale`;
  window.scrollTo(0, 0);
}

/* =========================================================
   5) YÖNLENDİRME (#sozler-3 gibi)
   ========================================================= */
let pendingHighlight = null;
function go(bookId, page) { location.hash = `${bookId}-${page}`; }
function route() {
  hidePop();
  const m = location.hash.match(/^#([a-z]+)-(\d+)$/);
  document.body.classList.toggle("reading", !!m);
  if (m) showPage(m[1], +m[2], pendingHighlight); else showLibrary();
  pendingHighlight = null;
}
window.addEventListener("hashchange", route);

// Klavye: ← → ile sayfa çevir
document.addEventListener("keydown", (e) => {
  if (!current.id || e.target.closest("input, select, textarea") || !$("#search").hidden) return;
  if (e.key === "ArrowRight") $("#next")?.click();
  if (e.key === "ArrowLeft") $("#prev")?.click();
});

/* =========================================================
   6) LUGAT VE HAŞİYE PENCERESİ
   ========================================================= */
const pop = $("#pop");
function hidePop() { pop.hidden = true; popFor = null; document.querySelectorAll(".w.on, .aw.on").forEach((e) => e.classList.remove("on")); }
function showPop(el, html) {
  hidePop();
  pop.innerHTML = html;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), window.innerWidth - w - 16);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 16) top = Math.max(16, r.top - h - 8);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}
let popFor = null; // pencerenin şu an hangi kelime için açık olduğu
function openFor(el) {
  if (popFor === el && !pop.hidden) return;
  if (el.classList.contains("aw")) {
    const x = ARAPCA[+el.dataset.a];
    showPop(el, `<div class="lbl">Meâl</div><div class="ar" lang="ar">${escapeHtml(el.textContent)}</div><div class="def">${escapeHtml(x.m)}</div>${x.r ? `<div class="ref">${escapeHtml(x.r)}</div>` : ""}`);
    el.classList.add("on");
  } else if (el.classList.contains("w")) {
    showPop(el, `<div class="lbl">Lugat</div><div class="word">${escapeHtml(el.dataset.k)}</div><div class="def">${escapeHtml(LUGAT[el.dataset.k])}</div>`);
    el.classList.add("on");
  } else {
    const txt = BOOKS.get(current.id)?.footnotes[el.dataset.fn];
    showPop(el, `<div class="lbl">Haşiye ${escapeHtml(el.textContent)}</div><div class="def">${txt ? escapeHtml(txt) : "Bu haşiyenin metni bulunamadı."}</div>`);
  }
  popFor = el;
}
// Dokunmatik ekranda ve tıklamada: dokununca aç
document.addEventListener("click", (e) => {
  if (e.target.closest("#pop")) return;
  const el = e.target.closest(".w, .fn, .aw");
  if (el) return openFor(el);
  hidePop();
});
// Fareli bilgisayarda: üstüne gelince aç, ayrılınca kapat
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
let hoverTimer;
document.addEventListener("mouseover", (e) => {
  if (!canHover) return;
  if (e.target.closest("#pop")) { clearTimeout(hoverTimer); return; }
  const el = e.target.closest(".w, .fn, .aw");
  if (!el) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => openFor(el), 120);
});
document.addEventListener("mouseout", (e) => {
  if (!canHover) return;
  const from = e.target.closest(".w, .fn, .aw, #pop");
  const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest(".w, .fn, .aw, #pop") : null;
  if (from && !to) { clearTimeout(hoverTimer); hoverTimer = setTimeout(hidePop, 250); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches?.(".w, .aw")) e.target.click();
  if (e.key === "Escape") { hidePop(); closeSearch(); closeDrawer(); toggleSettings(false); }
});
window.addEventListener("scroll", hidePop, { passive: true });

/* =========================================================
   7) ARAMA (dört kitapta birden)
   ========================================================= */
const searchPanel = $("#search"), q = $("#q"), results = $("#results");
const indexCache = new Map();
function indexOf(book) {
  if (!indexCache.has(book.id)) {
    const rows = [];
    book.pages.forEach((p, i) => p.b.forEach(([k, t]) => {
      if (k === "ar") return;
      const text = stripFn(t);
      rows.push({ page: i + 1, section: p.s, text, plain: plain(text) });
    }));
    indexCache.set(book.id, rows);
  }
  return indexCache.get(book.id);
}
let allLoaded = false;
let scope = "book";
$("#scope").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  scope = b.dataset.v;
  $("#scope").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  runSearch(); q.focus();
});
async function openSearch() {
  searchPanel.hidden = false; q.focus();
  $("#scope").hidden = !current.id;
  if (!allLoaded) {
    results.innerHTML = `<div class="empty">Kitaplar aranmaya hazırlanıyor…</div>`;
    try { await Promise.all(LIBRARY.map((b) => loadBook(b.id))); allLoaded = true; }
    catch { results.innerHTML = `<div class="empty">Kitaplar yüklenemedi. İnternet bağlantını kontrol et.</div>`; return; }
  }
  runSearch();
}
function closeSearch() { searchPanel.hidden = true; }
let searchTimer;
function runSearch() {
  if (!allLoaded) return;
  const term = plain(q.value.trim());
  if (term.length < 3) { results.innerHTML = `<div class="empty">En az 3 harf yaz.</div>`; return; }
  const ids = current.id && scope === "book" ? [current.id] : LIBRARY.map((b) => b.id);
  const hits = [];
  let total = 0;
  for (const id of ids) {
    const book = BOOKS.get(id);
    for (const r of indexOf(book)) {
      let idx = r.plain.indexOf(term);
      while (idx >= 0) {
        total++;
        if (hits.length < 60) hits.push({ book, ...r, idx });
        idx = r.plain.indexOf(term, idx + term.length);
        break; // bir paragrafı bir kez listele
      }
    }
  }
  if (!hits.length) { results.innerHTML = `<div class="empty">“${escapeHtml(q.value)}” için sonuç yok.</div>`; return; }
  results.innerHTML = `<div class="empty">${total.toLocaleString("tr")} paragrafta geçiyor${total > hits.length ? `, ilk ${hits.length} tanesi gösteriliyor` : ""}.</div>` +
    hits.map((h, n) => {
      const start = Math.max(0, h.idx - 50);
      const snip = (start ? "…" : "") + h.text.slice(start, h.idx + term.length + 80) + "…";
      return `<button class="result" data-n="${n}">
        <div class="where">${escapeHtml(h.book.title)} · ${escapeHtml(h.section)} · Sayfa ${h.page}</div>
        <div class="snip">${renderWords(snip, term).replace(/<span[^>]*>|<\/span>/g, "")}</div>
      </button>`;
    }).join("");
  results.querySelectorAll(".result").forEach((el) => el.onclick = () => {
    const h = hits[+el.dataset.n];
    pendingHighlight = term;
    closeSearch();
    const target = `#${h.book.id}-${h.page}`;
    if (location.hash === target) route(); else location.hash = target;
  });
}
q.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 200); });
searchPanel.addEventListener("click", (e) => { if (e.target === searchPanel) closeSearch(); });
$("#btn-search").onclick = openSearch;

/* =========================================================
   8) AYARLAR: yazı boyutu ve gece modu
   ========================================================= */
const settings = Object.assign({ size: 19, theme: null, font: "book", lh: "1.75" }, store.get("nr-settings", {}));
const FONTS = { book: "var(--font-body)", classic: '"EB Garamond", "Amiri", Georgia, serif', sans: 'var(--font-ui), "Amiri", sans-serif' };
function applySettings() {
  const root = document.documentElement;
  root.style.setProperty("--reader-size", settings.size + "px");
  root.style.setProperty("--reader-lh", settings.lh);
  root.style.setProperty("--reader-font", FONTS[settings.font] || FONTS.book);
  // Tema: "sepia" açık temanın sıcak tonu; null = cihazın ayarı
  if (settings.theme === "sepia") { root.dataset.theme = "light"; root.dataset.tone = "sepia"; }
  else { delete root.dataset.tone; if (settings.theme) root.dataset.theme = settings.theme; else delete root.dataset.theme; }
  $("#size-out").textContent = settings.size;
  const activeTheme = settings.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  for (const [id, val] of [["#set-theme", activeTheme], ["#set-font", settings.font], ["#set-lh", settings.lh]])
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(val)));
  store.set("nr-settings", settings);
}
for (const [id, key] of [["#set-theme", "theme"], ["#set-font", "font"], ["#set-lh", "lh"]])
  $(id).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { settings[key] = b.dataset.v; applySettings(); } });
$("#btn-smaller").onclick = () => { settings.size = Math.max(15, settings.size - 1); applySettings(); };
$("#btn-bigger").onclick = () => { settings.size = Math.min(30, settings.size + 1); applySettings(); };
const settingsPanel = $("#settings");
function toggleSettings(open = settingsPanel.hidden) {
  settingsPanel.hidden = !open;
  $("#btn-settings").setAttribute("aria-expanded", open);
}
$("#btn-settings").onclick = (e) => { e.stopPropagation(); toggleSettings(); };
document.addEventListener("click", (e) => { if (!settingsPanel.hidden && !e.target.closest("#settings, #btn-settings")) toggleSettings(false); });

/* =========================================================
   9) YER İMLERİ
   ========================================================= */
const getMarks = () => store.get("nr-marks", []);
const isMarked = (id, page) => getMarks().some((m) => m.book === id && m.page === page);
function toggleMark(book, page, section) {
  let marks = getMarks();
  if (marks.some((m) => m.book === book.id && m.page === page)) {
    marks = marks.filter((m) => !(m.book === book.id && m.page === page));
    toast("Yer imi kaldırıldı");
  } else {
    marks.unshift({ book: book.id, title: book.title, section, page, at: Date.now() });
    toast("Sayfa işaretlendi");
  }
  store.set("nr-marks", marks.slice(0, 100));
}
function marksHtml() {
  return `<div class="marks">${getMarks().map((m, i) => `
    <div class="mark-row">
      <a href="#${m.book}-${m.page}">${escapeHtml(m.section)}<small>${escapeHtml(m.title)} · Sayfa ${m.page}</small></a>
      <button data-unmark="${i}" aria-label="Yer imini kaldır">✕</button>
    </div>`).join("")}</div>`;
}
function bindMarks(root, after = route) {
  root.querySelectorAll("[data-unmark]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const marks = getMarks(); marks.splice(+b.dataset.unmark, 1); store.set("nr-marks", marks);
    after();
  });
}

/* =========================================================
   10) SESLİ OKUMA (tarayıcının Türkçe sesiyle)
   ========================================================= */
const speechOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let speaking = false, speakToken = 0;
function turkishVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find((v) => /^tr/i.test(v.lang)) || null;
}
function startSpeaking() { speaking = true; speakPage(); refreshListenBtn(); }
function stopSpeaking() {
  if (!speechOK) return;
  speaking = false; speakToken++;
  speechSynthesis.cancel();
  document.querySelectorAll(".speaking").forEach((e) => e.classList.remove("speaking"));
  refreshListenBtn();
}
function refreshListenBtn() {
  const b = $("#listen-btn"); if (!b) return;
  b.classList.toggle("on", speaking);
  b.querySelector(".t").textContent = speaking ? "Durdur" : "Dinle";
}
function speakPage() {
  if (!speaking) return;
  speechSynthesis.cancel();
  const token = ++speakToken;
  const els = [...document.querySelectorAll(".text > p:not(.arabic), .text > h4")];
  const voice = turkishVoice();
  const next = (i) => {
    if (token !== speakToken) return;
    document.querySelectorAll(".speaking").forEach((e) => e.classList.remove("speaking"));
    if (i >= els.length) { // sayfa bitti: sonraki sayfaya geç ve okumaya devam et
      const n = $("#next");
      if (n && !n.disabled) n.click(); else stopSpeaking();
      return;
    }
    const el = els[i];
    const text = el.textContent.replace(/\s\d+\s/g, " ").trim();
    if (!text) return next(i + 1);
    el.classList.add("speaking");
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR"; if (voice) u.voice = voice; u.rate = 0.95;
    u.onend = () => next(i + 1);
    u.onerror = () => { if (token === speakToken) stopSpeaking(); };
    speechSynthesis.speak(u);
  };
  next(0);
}
window.addEventListener("hashchange", () => { if (speaking) speakToken++; });

/* =========================================================
   11) SEÇİLEN METNİ KAYNAĞIYLA KOPYALAMA
   ========================================================= */
const seltool = $("#seltool");
function selectedText() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed) return "";
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  return node && node.closest(".text") ? sel.toString().trim() : "";
}
function placeSeltool() {
  const text = selectedText();
  if (!text || !current.id) { seltool.hidden = true; return; }
  const r = getSelection().getRangeAt(0).getBoundingClientRect();
  seltool.hidden = false;
  const w = seltool.offsetWidth;
  seltool.style.left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), innerWidth - w - 12) + "px";
  seltool.style.top = Math.max(70, r.top - seltool.offsetHeight - 10) + "px";
}
document.addEventListener("mouseup", () => setTimeout(placeSeltool, 10));
document.addEventListener("touchend", () => setTimeout(placeSeltool, 250));
document.addEventListener("selectionchange", () => { if (!selectedText()) seltool.hidden = true; });
$("#sel-copy").onclick = async () => {
  const text = selectedText();
  const book = BOOKS.get(current.id), page = book.pages[current.page - 1];
  const cite = `"${text}"\n— ${book.title}, ${page.s}, s. ${current.page}`;
  try { await navigator.clipboard.writeText(cite); toast("Kaynağıyla kopyalandı"); }
  catch { toast("Kopyalanamadı; metni seçip Ctrl+C ile kopyalayabilirsin"); }
  seltool.hidden = true;
};
$("#sel-search").onclick = () => { const t = selectedText(); seltool.hidden = true; q.value = t.slice(0, 60); openSearch(); };

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}

/* =========================================================
   12) MOBİLDE KAYDIRARAK SAYFA ÇEVİRME
   ========================================================= */
let touch = null;
app.addEventListener("touchstart", (e) => { if (e.touches.length === 1) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
app.addEventListener("touchend", (e) => {
  if (!touch || !current.id) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  const quick = Date.now() - touch.t < 600;
  touch = null;
  if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6 || selectedText()) return;
  if (dx < 0) $("#next")?.click(); else $("#prev")?.click();
}, { passive: true });

for (const id of ["#home", "#drawer-home"]) $(id).onclick = (e) => { e.preventDefault(); closeDrawer(); location.hash = ""; };

applySettings();
if (store.get("nr-side-off", false)) document.body.classList.add("side-off");
Promise.all([loadLibrary(), loadLugat()]).then(route).catch(() => { app.innerHTML = `<div class="loading">Kitap listesi yüklenemedi. Sayfayı yenile.</div>`; });
</script>
