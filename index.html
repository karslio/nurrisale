<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NurRisale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Düzen: üst çubuk + ikinci çubuk (Kitaplar | yol + sayfa); solda kitap ağacı (telefonda açılır), sağda okuma alanı.
   Bölümler tek parça kaydırılarak okunur; sayfa kutusu görünen sayfayı gösterir. */
:root {
  --paper: #FDFCF8;    /* zemin */
  --side: #FAF8F1;     /* sol panel */
  --surface: #FFFFFF;  /* açılır pencereler */
  --soft: #F1EEE4;     /* yuvarlak düğmeler */
  --ink: #2A2722;      /* yazı */
  --muted: #7C766A;    /* ikincil yazı */
  --rule: #E6DEC5;     /* altın tonlu çizgi */
  --select: #E9DFB7;   /* seçili satır */
  --red: #C81E2B;      /* başlık ve Arapça */
  --lugat: #9A6418;    /* lugat kelimeleri */
  --accent: #A0522D;   /* bağlantı ve vurgu */
  --mark: #FBE7A1;     /* arama vurgusu */
  --font-title: "UnifrakturMaguntia", "Times New Roman", serif;
  --font-body: "Literata", "Amiri", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-arabic: "Amiri", "Traditional Arabic", serif;
  --reader-size: 19px;
  --reader-lh: 1.7;
  --reader-font: var(--font-body);
  --side-w: 340px;
  --bar1: 64px;
  --bar2: 40px;
}
:root[data-tone="sepia"] { --paper: #F5EEDC; --side: #EFE6D0; --surface: #FBF6EA; --soft: #E8DEC6; --ink: #3A2E21; --muted: #7A6A55; --rule: #DCCBA6; --select: #E3D19C; --mark: #F0D98F; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15130F; --side: #1B1814; --surface: #221F1A; --soft: #2A2620; --ink: #E8E2D4; --muted: #A39B8B; --rule: #3A342A;
    --select: #3F3522; --red: #F06A6F; --lugat: #E0B062; --accent: #E09A6C; --mark: #5A4512; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15130F; --side: #1B1814; --surface: #221F1A; --soft: #2A2620; --ink: #E8E2D4; --muted: #A39B8B; --rule: #3A342A;
  --select: #3F3522; --red: #F06A6F; --lugat: #E0B062; --accent: #E09A6C; --mark: #5A4512; color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Üst çubuklar ---------- */
.bars { position: fixed; z-index: 20; top: env(safe-area-inset-top, 0px); left: 0; right: 0; background: var(--paper); }
.bar1 { height: var(--bar1); display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--rule); }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); width: calc(var(--side-w) - 16px); flex: none; }
.logo .mark { width: 30px; height: 30px; flex: none; }
.logo .name { font-family: var(--font-body); font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.logo .name b { color: var(--red); font-weight: 600; }
.tabs { display: flex; align-items: flex-end; gap: 6px; align-self: stretch; min-width: 0; overflow: hidden; flex: 1; padding-top: 12px; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 14px; border: 1px solid transparent; border-bottom: none; border-radius: 12px 12px 0 0; background: var(--soft); color: var(--muted); font-size: 15px; cursor: pointer; max-width: 220px; min-width: 0; flex: 0 1 auto; position: relative; }
.tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab svg { width: 17px; height: 17px; flex: none; }
.tab.on { background: var(--paper); color: var(--ink); border-color: var(--rule); margin-bottom: -1px; height: 41px; }
.tab.on svg { color: var(--red); }
.tab .x { border: none; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; font-size: 14px; line-height: 1; }
.tab .x:hover { background: var(--rule); color: var(--ink); }
.tab-add { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--soft); color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; align-self: center; flex: none; }
.home-link { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--rule); border-bottom: none; border-radius: 12px 12px 0 0; background: var(--paper); text-decoration: none; color: var(--ink); align-self: flex-end; margin-bottom: -1px; font-size: 15px; }
.home-link svg { width: 18px; height: 18px; color: var(--red); }
.tools { margin-left: auto; display: flex; gap: 8px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.round:hover { filter: brightness(.95); }
.round svg { width: 21px; height: 21px; }
.bar2 { height: var(--bar2); display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
.bar2 .side-title { width: var(--side-w); flex: none; display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); height: 100%; border-right: 1px solid var(--rule); background: var(--side); font-weight: 600; font-size: 16px; border: none; cursor: pointer; text-align: left; }
.bar2 .side-title svg { width: 22px; height: 22px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--ink); text-decoration: none; }
.crumbs svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.crumbs .cur { overflow: hidden; text-overflow: ellipsis; }
.pagebox { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; }
.pagebox input { width: 4.2em; height: 28px; text-align: center; font: 600 15px var(--font-ui); border: 1px solid var(--muted); border-radius: 6px; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
.pagebox .tot { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: inline-flex; }
.bar-btn svg { width: 20px; height: 20px; }
.bar-btn.on { color: var(--red); }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--red); width: 0; transition: width .2s ease; }

/* ---------- Sol kitap ağacı ---------- */
.side { position: fixed; z-index: 15; left: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar1) + var(--bar2)); bottom: 0; width: var(--side-w); background: var(--side); border-right: 1px solid var(--rule); overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); }
.tree { list-style: none; margin: 0; padding: 0; }
.tree .row { display: flex; align-items: center; gap: 6px; min-height: 36px; padding-right: 10px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); cursor: pointer; font-size: 15px; line-height: 1.25; }
.tree .row:hover { background: color-mix(in srgb, var(--select) 40%, transparent); }
.tree .row.cur { background: var(--select); border-radius: 8px; margin: 2px 6px; border-bottom-color: transparent; }
.tree .tw { width: 22px; flex: none; text-align: center; font-size: 10px; color: var(--ink); transition: transform .15s ease; }
.tree .tw.open { transform: rotate(90deg); }
.tree .tw.none { visibility: hidden; }
.tree .ic { width: 15px; height: 15px; flex: none; color: var(--red); }
.tree .lbl { flex: 1; min-width: 0; padding: 7px 0; }
.tree .ok { color: var(--muted); font-size: 13px; }
.tree .d0 { padding-left: 10px; font-weight: 500; }
.tree .d1 { padding-left: 26px; }
.tree .d2 { padding-left: 46px; }
.tree .d3 { padding-left: 66px; font-size: 14px; }
.tree .d4 { padding-left: 86px; font-size: 13.5px; color: var(--muted); }
.side .marks-h { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 6px; }
.side .mk { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 16px; font-size: 14px; }
.side .mk a { flex: 1; min-width: 0; color: var(--ink); text-decoration: none; }
.side .mk small { display: block; color: var(--muted); font-size: 12px; }
.side .mk button { background: none; border: none; color: var(--muted); cursor: pointer; }

/* ---------- Ana alan ---------- */
main { margin-left: var(--side-w); padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar1) + var(--bar2)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: 80px; min-height: 100%; }
.scrim { display: none; }

/* Ana sayfa: arama */
.home { max-width: 760px; margin: 0 auto; padding-block: 48px 24px; display: grid; gap: 18px; }
.emblem { text-align: center; font-family: var(--font-arabic); color: var(--red); font-size: 30px; line-height: 1.5; }
.home h1 { text-align: center; font-family: var(--font-title); color: var(--red); font-weight: 400; font-size: clamp(34px, 6vw, 52px); margin: 0; line-height: 1.1; }
.home-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 6px 4px 22px; background: var(--surface); }
.home-search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font: 16px var(--font-ui); color: var(--ink); height: 46px; }
.home-search button { height: 40px; width: 40px; border-radius: 50%; border: none; background: var(--soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.home-search button svg { width: 20px; height: 20px; }
.chips-h { text-align: center; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.card { border: 1px solid var(--rule); border-radius: 14px; background: var(--side); padding: 16px 18px; }
.card .h { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card strong { font-family: var(--font-body); font-size: 18px; }
.btn { background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 600; }
.home-results { display: grid; gap: 0; }
.shelf-h { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
.shelf-h h2 { font-size: 19px; margin: 0; font-weight: 600; }
.shelf-h span { color: var(--muted); font-size: 13px; }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 22px 16px; }
.cv { background: none; border: none; padding: 0; cursor: pointer; text-align: center; display: grid; gap: 8px; justify-items: center; }
.cv .img { height: 168px; display: flex; align-items: flex-end; }
.cv img { max-height: 168px; max-width: 100%; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 18px -8px rgba(0,0,0,.4); transition: transform .2s ease; }
.cv:hover img { transform: translateY(-3px); }
.cv span { font-size: 13.5px; line-height: 1.25; }

/* Okuma */
.reader { max-width: 760px; margin: 0 auto; padding-top: 36px; }
.chap-title { font-family: var(--font-title); color: var(--red); font-weight: 400; text-align: center; font-size: clamp(36px, 6vw, 60px); line-height: 1.1; margin: 10px 0 18px; text-wrap: balance; }
.chap-book { text-align: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.text { font-family: var(--reader-font); font-size: var(--reader-size); line-height: var(--reader-lh); text-align: justify; hyphens: auto; overflow-wrap: break-word; }
.text p { margin: 0 0 .8em; text-indent: 1.5em; }
.text p.c { text-align: center; text-indent: 0; }
.text .arabic { font-family: var(--font-arabic); direction: rtl; text-align: center; text-indent: 0; color: var(--red); font-size: 1.32em; line-height: 1.9; margin: .6em 0 .9em; }
.text h4 { font-family: var(--font-body); font-weight: 600; color: var(--red); text-align: center; font-size: 1.12em; margin: 1.6em 0 .7em; text-wrap: balance; }
.pmark { border-top: 1px solid var(--rule); margin: 1.1em -12px .9em; padding: 6px 12px 0; text-align: right; font: 600 15px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.w { color: var(--lugat); cursor: pointer; }
.w:hover, .w.on { text-decoration: underline; text-underline-offset: 3px; }
.aw { cursor: pointer; border-radius: 4px; }
.aw:hover, .aw.on { background: color-mix(in srgb, var(--red) 10%, transparent); }
.fn { font: 600 .62em/1 var(--font-ui); position: relative; top: -.6em; background: color-mix(in srgb, var(--red) 10%, transparent); border: none; border-radius: 4px; color: var(--red); cursor: pointer; padding: 1px 4px; margin: 0 1px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.text .speaking { background: color-mix(in srgb, var(--lugat) 14%, transparent); border-radius: 4px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--lugat) 14%, transparent); }
.chap-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule); }
.chap-nav button { flex: 1; max-width: 48%; background: var(--side); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; }
.chap-nav button:last-child { text-align: right; margin-left: auto; }
.chap-nav small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.loading { text-align: center; color: var(--muted); padding: 80px 0; font-family: var(--font-body); }

/* Yüzen düğmeler (okurken) */
.fab { position: fixed; z-index: 14; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.fab button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); box-shadow: 0 6px 16px -6px rgba(0,0,0,.3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.fab button svg { width: 21px; height: 21px; }
.fab button.on { color: var(--red); border-color: var(--red); }

/* Lugat / haşiye / meâl baloncuğu */
.pop { position: fixed; z-index: 40; max-width: min(340px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.14); padding: 9px 14px; font-size: 15px; color: var(--ink); line-height: 1.5; }
.pop .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin-bottom: 2px; }
.pop .ar { font-family: var(--font-arabic); direction: rtl; font-size: 19px; color: var(--red); line-height: 1.7; }
.pop .ref { margin-top: 6px; font-size: 12px; color: var(--muted); }

/* Ayarlar */
.settings { position: fixed; z-index: 35; top: calc(env(safe-area-inset-top, 0px) + var(--bar1) + 6px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(320px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.18); padding: 16px; display: grid; gap: 16px; }
.settings .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 6px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.seg button.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.seg .sw-light { background: #FDFCF8; color: #2A2722; } .seg .sw-sepia { background: #F5EEDC; color: #3A2E21; } .seg .sw-dark { background: #15130F; color: #E8E2D4; }
.seg .f-book { font-family: "Literata", Georgia, serif; } .seg .f-classic { font-family: "EB Garamond", Georgia, serif; font-size: 15px; } .seg .f-sans { font-family: var(--font-ui); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 40px; height: 36px; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; cursor: pointer; font-size: 16px; }
.stepper output { flex: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }

/* Arama penceresi */
.search-panel { position: fixed; inset: 0; z-index: 45; background: color-mix(in srgb, #000 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 8vh) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.search-box { width: min(680px, 100%); background: var(--surface); border-radius: 14px; border: 1px solid var(--rule); max-height: 78vh; display: flex; flex-direction: column; overflow: hidden; }
.search-box input { border: none; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: inherit; font-size: 17px; background: transparent; color: var(--ink); outline: none; }
.scope { display: flex; gap: 6px; padding: 10px 18px 0; }
.scope button { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.scope button.on { border-color: var(--red); color: var(--red); }
.results { overflow-y: auto; }
.result { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--rule); padding: 12px 18px; cursor: pointer; }
.result:hover { background: var(--side); }
.result .where { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.result .snip { font-family: var(--font-body); margin-top: 3px; line-height: 1.5; }
.empty { padding: 14px 18px; color: var(--muted); }
.home-results .result { padding-inline: 4px; }
.home-results .empty { padding-inline: 4px; }

.seltool { position: fixed; z-index: 42; display: flex; gap: 2px; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.seltool button { background: none; border: none; color: inherit; padding: 6px 10px; cursor: pointer; font-size: 13px; border-radius: 6px; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 99px; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.25); }

/* ---------- Telefon ve tablet ---------- */
@media (max-width: 960px) {
  :root { --bar1: 56px; --side-w: min(340px, 86vw); }
  .logo { width: auto; }
  .logo .name { font-size: 22px; }
  .home-link, .tabs { display: none; }
  .round { width: 38px; height: 38px; }
  .bar2 .side-title { width: auto; padding-right: 12px; background: none; border-right: 1px solid var(--rule); }
  .bar2 .side-title span { display: none; }
  .side { z-index: 25; top: 0; padding-top: env(safe-area-inset-top, 0px); transform: translateX(-102%); transition: transform .25s ease; box-shadow: 8px 0 24px -12px rgba(0,0,0,.35); }
  body.side-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  body.side-open .scrim { opacity: 1; pointer-events: auto; }
  main { margin-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .reader { padding-top: 22px; }
  .text { text-align: left; }
  .fab { right: max(14px, env(safe-area-inset-right, 0px)); }
  .fab button { width: 44px; height: 44px; }
  .covers { grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 18px 12px; }
  .cv .img { height: 140px; } .cv img { max-height: 140px; }
}
@media (prefers-reduced-motion: reduce) { .side, .scrim, .cv img, .tree .tw { transition: none; } }
</style>

<div class="bars" id="bars">

// Her ifade için harekeyi ve harf çeşitlerini (أ إ آ, ى ي, ة ه) yok sayan bir kalıp kur
const AR_MARKS = "[\\u064B-\\u065F\\u0670\\u0640\\u06D6-\\u06ED]*";
const AR_VARIANTS = { "ا": "[اأإآٱ]", "ى": "[ىيئ]", "ي": "[يىئ]", "ة": "[ةته]", "ه": "[هة]", "و": "[وؤ]", "ت": "[تة]", "ك": "[كک]", "ء": "[ءئؤأ]?" };
const arPattern = (key) => [...key].map((ch) => ch === " " ? "\\s*" : (AR_VARIANTS[ch] || ch) + AR_MARKS).join("");
const AR_ORDER = ARAPCA.map((x, i) => i).sort((a, b) => ARAPCA[b].a.length - ARAPCA[a].a.length);
const AR_RE = new RegExp(AR_ORDER.map((i) => `(${arPattern(ARAPCA[i].a)})`).join("|"), "g");
function renderArabic(text) {
  let out = "", last = 0;
  for (const m of text.matchAll(AR_RE)) {
    const g = m.slice(1).findIndex((x) => x !== undefined);
    out += escapeHtml(text.slice(last, m.index));
    out += `<span class="aw" data-a="${AR_ORDER[g]}" tabindex="0">${escapeHtml(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + escapeHtml(text.slice(last));
}


/* =========================================================

const $ = (s) => document.querySelector(s);

const stripFn = (s) => s.replace(FN_RE, "");

  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },

};

async function loadLibrary() {
  const r = await fetch("books/index.json");
  if (!r.ok) throw new Error("liste");
  LIBRARY = await r.json();
}
async function loadLugat() {
  try { const r = await fetch("books/lugat.json"); if (r.ok) { const x = await r.json(); for (const k in x) LUGAT[lower(k)] = x[k]; indexLugat(); } } catch {}
}
async function loadBook(id) {
  if (BOOKS.has(id)) return BOOKS.get(id);
  const r = await fetch(`books/${id}.json`);
  if (!r.ok) throw new Error("kitap");
  const book = await r.json();
  book.chapters = buildChapters(book);
  BOOKS.set(id, book);
  return book;
}
const metaOf = (id) => LIBRARY.find((b) => b.id === id);

/* Bölümler: aynı bölüm adını taşıyan ardışık sayfalar. Çok uzun olanlar parçalara ayrılır. */
function buildChapters(book) {
  const out = [];
  book.pages.forEach((p, i) => {
    const last = out[out.length - 1];
    if (last && last.title === p.s && i + 1 - last.start < 120) last.end = i + 1;
    else out.push({ title: p.s, start: i + 1, end: i + 1 });
  });
  out.forEach((c, i) => {
    c.idx = i;
    if (i === 0 && plain(c.title).replace(/[^a-z]/g, "") === plain(book.title).replace(/[^a-z]/g, "")) c.title = "Giriş";
    c.subs = book.toc.filter((t) => t.l > 1 && t.p >= c.start && t.p <= c.end);
  });
  return out;
}
const chapterOf = (book, page) => book.chapters.find((c) => page >= c.start && page <= c.end) || book.chapters[0];

/* Lugat eşleştirme */
let LUGAT_KEYS = [];
function indexLugat() { LUGAT_KEYS = Object.keys(LUGAT).sort((a, b) => b.length - a.length); }
indexLugat();
function findLugat(word) {
  const w = lower(word.replace(/['’].*$/, ""));
  if (LUGAT[w]) return w;
  return LUGAT_KEYS.find((k) => k.length >= 4 && w.startsWith(k)) || null;
}
const WORD = /([A-Za-zÇĞİÖŞÜçğıöşüÂÎÛâîû'’-]+)/;
function renderWords(text, highlight) {
  return text.split(WORD).map((part, i) => {
    if (i % 2 === 0) return escapeHtml(part);
    let html = escapeHtml(part);
    if (highlight && plain(part).includes(highlight)) html = `<mark>${html}</mark>`;
    const key = findLugat(part);
    return key ? `<span class="w" data-k="${escapeHtml(key)}">${html}</span>` : html;
  }).join("");
}
function renderText(text, highlight) {
  let out = "", last = 0;
  for (const m of text.matchAll(FN_RE)) {
    out += renderWords(text.slice(last, m.index), highlight);

  openNodes.add("shelf:" + (meta.shelf || "kulliyat")); openNodes.add("book:" + bookId); saveOpen();

    let html = `<article class="reader"><div class="chap-book">${escapeHtml(book.title)}</div><h1 class="chap-title">${escapeHtml(chap.title)}</h1><div class="text">`;

/* Görünen sayfayı takip et: sayfa kutusu, ilerleme çubuğu, kaldığın yer */
function observePages(book) {
  if (pageObserver) pageObserver.disconnect();

  const m = h.match(/^#([a-z]+)-(\d+)$/); if (!m) return "Yeni Sekme";
  const bk = BOOKS.get(m[1]); if (bk) return chapterOf(bk, +m[2]).title;

    if (!t) { t = tabs.find((x) => !x.h) || (tabs.push({ k: ++tabSeq, h: "" }), tabs[tabs.length - 1]); activeTab = t.k; }

}

    tabs.map((t) => `<div class="tab ${activeTab === t.k ? "on" : ""}" data-tab="${t.k}" role="button" tabindex="0">${ICON_OPEN}<span class="t">${escapeHtml(tabLabel(t.h))}</span><button class="x" data-close="${t.k}" aria-label="Sekmeyi kapat">✕</button></div>`).join("") +

    else { saveTabs(); renderTabs(); }

  }
  if (e.target.closest("#tab-add")) { tabs.push({ k: ++tabSeq, h: "" }); activeTab = tabSeq; saveTabs(); location.hash = ""; route(); return; }
  const t = e.target.closest("[data-tab]"); if (!t) return;
  if (t.dataset.tab === "search") { activeTab = "search"; saveTabs(); location.hash = ""; route(); return; }
  const tab = tabs.find((x) => x.k === +t.dataset.tab); activeTab = tab.k; saveTabs();

const searchPanel = $("#search"), q = $("#q"), results = $("#results");
const indexCache = new Map();
function indexOf(book) {
  if (!indexCache.has(book.id)) {
    const rows = [];
    book.pages.forEach((p, i) => p.b.forEach(([k, t]) => {
      if (k === "ar") return;
      const text = stripFn(t);
      rows.push({ page: i + 1, section: p.s, text, plain: plain(text) });
    }));
    indexCache.set(book.id, rows);
  }
  return indexCache.get(book.id);
}
async function ensureBooks(ids, onProgress) {
  let done = 0;
  await Promise.all(ids.map(async (id) => { await loadBook(id); onProgress && onProgress(++done, ids.length); }));
}
function findHits(term, ids) {
  const hits = []; let total = 0;
  for (const id of ids) for (const r of indexOf(BOOKS.get(id))) {
    const idx = r.plain.indexOf(term);
    if (idx < 0) continue;
    total++;
    if (hits.length < 80) hits.push({ book: BOOKS.get(id), ...r, idx });
  }
  return { hits, total };
}
function renderHits(container, term, raw, { hits, total }) {

  container.innerHTML = `<div class="empty">${total.toLocaleString("tr")} paragrafta geçiyor${total > hits.length ? `, ilk ${hits.length} tanesi gösteriliyor` : ""}.</div>` +
    hits.map((h, n) => {
      const start = Math.max(0, h.idx - 60);
      const snip = (start ? "…" : "") + h.text.slice(start, h.idx + term.length + 90) + "…";
      return `<button class="result" data-n="${n}"><div class="where">${escapeHtml(h.book.title)} · ${escapeHtml(h.section)} · Sayfa ${h.page}</div>
        <div class="snip">${renderWords(snip, term).replace(/<span[^>]*>|<\/span>/g, "")}</div></button>`;
    }).join("");
  container.querySelectorAll(".result").forEach((el) => el.onclick = () => {
    const h = hits[+el.dataset.n];
    pendingHighlight = term; closeSearch();
    const target = `#${h.book.id}-${h.page}`;

}
async function homeSearch(raw) {

  const ids = LIBRARY.map((b) => b.id);

  try { await ensureBooks(ids, (d, n) => { box.innerHTML = `<div class="empty">Kitaplar hazırlanıyor: ${d} / ${n}</div>`; }); }
  catch { box.innerHTML = `<div class="empty">Kitaplar yüklenemedi. Bağlantını kontrol et.</div>`; return; }

  if (term.length < 3) { results.innerHTML = `<div class="empty">En az 3 harf yaz.</div>`; return; }
  const ids = current.id && scope === "book" ? [current.id] : LIBRARY.map((b) => b.id);
  try { await ensureBooks(ids, (d, n) => { if (ids.length > 1) results.innerHTML = `<div class="empty">Kitaplar hazırlanıyor: ${d} / ${n}</div>`; }); }
  catch { results.innerHTML = `<div class="empty">Kitaplar yüklenemedi.</div>`; return; }
  if (plain(q.value.trim()) !== term) return;
  renderHits(results, term, q.value, findHits(term, ids));
}
q.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 220); });
searchPanel.addEventListener("click", (e) => { if (e.target === searchPanel) closeSearch(); });
$("#btn-search").onclick = openSearch;

/* =========================================================
   8) OKUMA AYARLARI
   ========================================================= */
const settings = Object.assign({ size: 19, theme: null, font: "book", lh: "1.7" }, store.get("nr-settings2", {}));
const FONTS = { book: "var(--font-body)", classic: '"EB Garamond", "Amiri", Georgia, serif', sans: 'var(--font-ui), "Amiri", sans-serif' };
function applySettings() {
  const root = document.documentElement;
  root.style.setProperty("--reader-size", settings.size + "px");
  root.style.setProperty("--reader-lh", settings.lh);
  root.style.setProperty("--reader-font", FONTS[settings.font] || FONTS.book);
  if (settings.theme === "sepia") { root.dataset.theme = "light"; root.dataset.tone = "sepia"; }
  else { delete root.dataset.tone; if (settings.theme) root.dataset.theme = settings.theme; else delete root.dataset.theme; }
  $("#size-out").textContent = settings.size;
  const activeTheme = settings.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  for (const [id, val] of [["#set-theme", activeTheme], ["#set-font", settings.font], ["#set-lh", settings.lh]])
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === String(val)));
  store.set("nr-settings2", settings);
}
for (const [id, key] of [["#set-theme", "theme"], ["#set-font", "font"], ["#set-lh", "lh"]])
  $(id).addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { settings[key] = b.dataset.v; applySettings(); } });
$("#btn-theme").onclick = () => {
  const dark = settings.theme ? settings.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  settings.theme = dark ? "light" : "dark"; applySettings();
};
$("#btn-smaller").onclick = () => { settings.size = Math.max(15, settings.size - 1); applySettings(); };
$("#btn-bigger").onclick = () => { settings.size = Math.min(30, settings.size + 1); applySettings(); };
const settingsPanel = $("#settings");
function toggleSettings(open = settingsPanel.hidden) { settingsPanel.hidden = !open; $("#btn-settings").setAttribute("aria-expanded", open); }
$("#btn-settings").onclick = (e) => { e.stopPropagation(); toggleSettings(); };
document.addEventListener("click", (e) => { if (!settingsPanel.hidden && !e.target.closest("#settings, #btn-settings")) toggleSettings(false); });

/* =========================================================
   9) YER İMLERİ
   ========================================================= */
const getMarks = () => store.get("nr-marks", []);
const isMarked = (id, page) => getMarks().some((m) => m.book === id && m.page === page);
function toggleMarkHere() {
  const book = BOOKS.get(current.id); if (!book) return;
  const page = current.page, section = book.pages[page - 1].s;
  let marks = getMarks();
  if (marks.some((m) => m.book === book.id && m.page === page)) { marks = marks.filter((m) => !(m.book === book.id && m.page === page)); toast("Yer imi kaldırıldı"); }
  else { marks.unshift({ book: book.id, title: book.title, section, page, at: Date.now() }); toast(`Sayfa ${page} işaretlendi`); }
  store.set("nr-marks", marks.slice(0, 100));
  renderCrumbs(); renderSide(); refreshListenBtn();
}
function bindMarks(root, after) {
  root.querySelectorAll("[data-unmark]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const marks = getMarks(); marks.splice(+b.dataset.unmark, 1); store.set("nr-marks", marks); after();
  });
}
$("#fab-mark").onclick = toggleMarkHere;
$("#fab-top").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

/* =========================================================
   10) SESLİ OKUMA
   ========================================================= */
const speechOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
if (!speechOK) $("#fab-listen").hidden = true;
let speaking = false, speakToken = 0;
function refreshListenBtn() {
  $("#fab-listen").classList.toggle("on", speaking);
  $("#fab-mark").classList.toggle("on", !!current.id && isMarked(current.id, current.page));
}
function stopSpeaking() {
  if (!speechOK) return;
  speaking = false; speakToken++; speechSynthesis.cancel();
  document.querySelectorAll(".speaking").forEach((e) => e.classList.remove("speaking"));
  refreshListenBtn();
}
function speakFrom() {
  if (!speaking) return;
  speechSynthesis.cancel();
  const token = ++speakToken;
  const top = $("#bars").getBoundingClientRect().bottom;
  const all = [...document.querySelectorAll(".text > p:not(.arabic), .text > h4")];
  let i = all.findIndex((el) => el.getBoundingClientRect().bottom > top + 10); if (i < 0) i = 0;
  const voice = speechSynthesis.getVoices().find((v) => /^tr/i.test(v.lang)) || null;
  const next = (k) => {
    if (token !== speakToken) return;
    document.querySelectorAll(".speaking").forEach((e) => e.classList.remove("speaking"));
    if (k >= all.length) { const n = $("#next-ch"); if (n) n.click(); else stopSpeaking(); return; }
    const el = all[k], text = el.textContent.trim();
    if (!text) return next(k + 1);
    el.classList.add("speaking"); el.scrollIntoView({ block: "center", behavior: "smooth" });
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR"; if (voice) u.voice = voice; u.rate = 0.95;
    u.onend = () => next(k + 1);
    u.onerror = () => { if (token === speakToken) stopSpeaking(); };
    speechSynthesis.speak(u);
  };
  next(i);
}
$("#fab-listen").onclick = () => { if (speaking) stopSpeaking(); else { speaking = true; refreshListenBtn(); speakFrom(); } };

/* =========================================================
   11) SEÇİLEN METNİ KAYNAĞIYLA KOPYALAMA
   ========================================================= */
const seltool = $("#seltool");
function selectedText() {
  const sel = getSelection(); if (!sel || sel.isCollapsed) return "";
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  return node && node.closest(".text") ? sel.toString().trim() : "";
}
function placeSeltool() {
  const text = selectedText();
  if (!text || !current.id) { seltool.hidden = true; return; }
  const r = getSelection().getRangeAt(0).getBoundingClientRect();
  seltool.hidden = false;
  const w = seltool.offsetWidth;
  seltool.style.left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), innerWidth - w - 12) + "px";
  seltool.style.top = Math.max($("#bars").getBoundingClientRect().bottom + 8, r.top - seltool.offsetHeight - 10) + "px";
}
document.addEventListener("mouseup", () => setTimeout(placeSeltool, 10));
document.addEventListener("touchend", () => setTimeout(placeSeltool, 250));
document.addEventListener("selectionchange", () => { if (!selectedText()) seltool.hidden = true; });
$("#sel-copy").onclick = async () => {
  const text = selectedText(), book = BOOKS.get(current.id), chap = chapterOf(book, current.page);
  const cite = `"${text}"\n— ${book.title}, ${chap.title}, s. ${current.page}`;
  try { await navigator.clipboard.writeText(cite); toast("Kaynağıyla kopyalandı"); } catch { toast("Kopyalanamadı; Ctrl+C ile kopyalayabilirsin"); }
  seltool.hidden = true;
};
$("#sel-search").onclick = () => { const t = selectedText(); seltool.hidden = true; q.value = t.slice(0, 60); openSearch(); };
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }

/* =========================================================
   BAŞLAT
   ========================================================= */
applySettings();
Promise.all([loadLibrary(), loadLugat()]).then(async () => {
  // Açık kalan kitapların bölümlerini yükle
  await Promise.all([...openNodes].filter((k) => k.startsWith("book:")).map((k) => loadBook(k.slice(5)).catch(() => {})));
  route();
}).catch(() => { app.innerHTML = `<div class="loading">Kitap listesi yüklenemedi. Sayfayı yenile.</div>`; });
</script>
